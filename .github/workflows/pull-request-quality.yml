name: Pull Request Quality

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write

jobs:
  code-quality:
    name: Flutter code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code
        shell: bash
        run: |
          echo "::add-matcher::.github/flutter-analyze-matcher.json"
          set +e
          flutter --no-color analyze --no-pub --fatal-infos --fatal-warnings 2>&1 | tee "$RUNNER_TEMP/flutter-analyze.log"
          analysis_exit=${PIPESTATUS[0]}
          set -e
          {
            echo '### Flutter analysis'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/flutter-analyze.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::remove-matcher owner=flutter-analyze::"
          exit "$analysis_exit"

      - name: Run tests
        run: flutter test --no-pub --coverage

      - name: Check test coverage
        shell: bash
        run: |
          set -o pipefail
          dart run coverde check 80 \
            --input=coverage/lcov.info \
            --file-coverage-log-level=none 2>&1 | tee coverage/summary.txt

      - name: Prepare coverage comment
        if: github.event_name == 'pull_request'
        run: |
          {
            echo '<!-- flutter-coverage -->'
            echo '## Flutter test coverage'
            echo
            cat coverage/summary.txt
            echo
            echo 'The full LCOV report is generated by the workflow test step.'
          } > coverage/comment.md

      - name: Comment coverage on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('coverage/comment.md', 'utf8');
            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const existing = comments.find(
                (comment) =>
                  comment.user.type === 'Bot' &&
                  comment.body.includes('<!-- flutter-coverage -->'),
              );
              const request = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              };
              if (existing) {
                await github.rest.issues.updateComment({
                  ...request,
                  comment_id: existing.id,
                });
              } else {
                await github.rest.issues.createComment({
                  ...request,
                  issue_number: context.issue.number,
                });
              }
            } catch (error) {
              if (error.status === 403) {
                console.log('Skipping coverage comment: token lacks permission for PR comments.');
              } else {
                throw error;
              }
            }
