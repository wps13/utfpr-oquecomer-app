name: Pull Request Quality

on:
  pull_request:

permissions:
  contents: read

jobs:
  code-quality:
    name: Flutter code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code
        shell: bash
        run: |
          echo "::add-matcher::.github/flutter-analyze-matcher.json"
          set +e
          flutter --no-color analyze --no-pub --fatal-infos --fatal-warnings 2>&1 | tee "$RUNNER_TEMP/flutter-analyze.log"
          analysis_exit=${PIPESTATUS[0]}
          set -e
          {
            echo '### Flutter analysis'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/flutter-analyze.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::remove-matcher owner=flutter-analyze::"
          exit "$analysis_exit"
