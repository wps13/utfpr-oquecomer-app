name: o_que_comer_app
description: "O Que Comer: receitas a partir do que você tem na geladeira, com ajuda de IA."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  device_info_plus: ^13.3.0
  dio: ^5.11.1
  firebase_core: ^5.0.0
  firebase_crashlytics: ^6.0.0
  flutter:
    sdk: flutter
  geocoding: ^5.0.1
  geolocator: ^14.1.2
  go_router: ^18.1.0
  hive_ce: ^2.11.3
  hive_ce_flutter: ^2.3.1
  http: ^1.6.0
  image_picker: ^1.2.1
  permission_handler: ^12.0.3
  provider: ^6.1.5+1
  speech_to_text: ^7.5.0

dev_dependencies:
  coverde: ^0.4.1
  hive_ce_test: ^2.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  adaptive_icon_monochrome: assets/icon/app_icon_foreground.png

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash/splash_logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/splash/splash_logo.png
